[package]
name = "nm-report-renderer"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
[dependencies]
nm-module-runtime = { path = "../nm-module-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tera = "2.4"
ammonia = "4.1.4"
css-inline = "0.21.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }
