[package]
name = "network_mapping_server"
version = "0.1.27"
edition = "2024"

[dependencies]
actix-web = { version = "4", features = ["openssl"] }
actix-files = "0.6"
actix-session = "0.10"
tera = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "json"] }
tracing-appender = "0.2"
rand = "0.10"
tokio-postgres = { version = "0.7", features = ["array-impls", "with-cidr-0_3", "with-chrono-0_4", "with-uuid-1"]}
cidr = { version = "0.3", features = ["serde"]}
deadpool-postgres = { version = "0.14"}
deadpool = "0.13"
argon2 = "0.5"
password-hash = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time"] }
uuid = { version = "1.18", features = ["v4", "v7", "serde"]}
sysinfo = "0.39"
chrono-tz = "0.10"
chrono = {version = "0.4", features = ["serde"]}
postgres-types = { version = "0.2", features = ["derive", "with-serde_json-1"] }
futures-util = "0.3"
futures = "0.3"
fs2 = "0.4"
ipnet = "2.12"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
openssl = "0.10"
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "pool"]}
totp-rs = { version = "5.7", features = ["gen_secret", "otpauth"]}
postgres-from-row = "0.5"
toml_edit = "0.25"
clap = { version = "4.6", features = ["derive"]}
rpassword = "7"
maxminddb = "0.28.1"
ammonia = "4.1.4"
css-inline = "0.21.1"
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "ab_glyph"] }
png = "0.18"

[features]
default = []
rir = []

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
