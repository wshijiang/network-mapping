[package]
name = "rust_web_test"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4", features = ["openssl"] }
actix-files = "0.6"
actix-session = "0.10"
tera = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "json"] }
tracing-appender = "0.2"
rand = "0.9"
tokio-postgres = { version = "0.7", features = ["array-impls", "with-cidr-0_3"]}
cidr = { version = "0.3", features = ["serde"]}
deadpool-postgres = "0.14"
deadpool = "0.12"
argon2 = "0.5"
password-hash = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
uuid = { version = "1.23", features = ["v4", "v7", "serde"]}
sysinfo = "0.38"
chrono = {version = "0.4", features = ["serde"]}
postgres-types = { version = "0.2", features = ["derive", "with-serde_json-1"] }
futures-util = "0.3"
futures = "0.3"
ipnet = "2.12"
regex = "1.12"
openssl = "0.10"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3