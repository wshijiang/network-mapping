site_name: Network Mapping 文档
site_description: 网络测绘系统技术文档
site_url: https://blog.abdc.world

docs_dir: ../docs
site_dir: site
exclude_docs: |
  /en/
  /INTERNATIONALIZATION_PLAN.md

theme:
  name: material
  custom_dir: overrides
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit    # 编辑
    - content.action.view    # 查看源代码

validation:
  nav:
    omitted_files: warn
  links:
    absolute_links: relative_to_docs
    not_found: warn
    anchors: warn
    unrecognized_links: warn

plugins:
  - search:
      lang:
        - zh
        - en

nav:
  - 文档首页: README.md
  - 更新日志: CHANGELOG.md
  - 配套发布与升级: RELEASING.md
  - 入门部署:
      - 部署选型与原生安装: DEPLOYMENT.md
      - Docker 部署: DOCKER.md
      - Docker 配置参考: DOCKER_CONFIGURATION.md
      - 启动配置检查: CONFIG_CHECK.md
      - 登录人机验证: HUMAN_VERIFICATION.md
      - 用户管理 CLI: USER_MANAGEMENT_CLI.md
  - 功能使用:
      - 功能概览: FEATURES.md
      - 威胁情报与 AI 审核: THREAT_INTELLIGENCE.md
      - LLM 配置与调试: LLM.md
      - 操作系统识别: OS_DETECTION.md
      - Web 框架与组件识别: WEB_DETECTION.md
      - Web 技术目录: WEB_TECHNOLOGY_CATALOG.md
      - Web 技术标签图标: https://github.com/wshijiang/network-mapping-vue/blob/feat/web-technology-detection/docs/WEB_TECHNOLOGY_ICONS.md
      - 资产搜索: SEARCH_SYNTAX.md
      - 统计分析: STATISTICS.md
      - 周报与月报: reports.md
      - 业务时区与常规设置: SYSTEM_TIME.md
  - 扫描与资产:
      - 服务探测分批计划: SERVICE_DETECTION_ROADMAP.md
      - 服务协议识别与部署: SERVICE_PROTOCOLS.md
      - DNS 与 VNC 服务识别扩展计划: DNS_DOH_DOT_VNC_PLAN.md
      - 工业与物联网服务识别扩展计划: INDUSTRIAL_SERVICE_DETECTION_PLAN.md
      - 扫描流水线与结果协议: SCAN_PIPELINE.md
      - 双栈与自动目标: DUAL_STACK_SCANNING.md
      - 智能目标与扫描器分配: SMART_SCANNING.md
      - 搜索触发目标更新: SEARCH_TARGET_GENERATION.md
      - DNS 测绘: DNS_MAPPING.md
      - 证书透明度域名发现: DOMAIN_DISCOVERY.md
      - 资产端口状态与历史: ASSET_PORT_HISTORY.md
      - 扫描器任务恢复协议: scanner-recovery.md
  - 存储与性能:
      - Elasticsearch 存储: ELASTICSEARCH.md
      - 扫描写入与资产发布: WRITE_SPEED.md
      - 扫描分析快照: ANALYTICS_SNAPSHOTS.md
      - 写入压力测试: SCAN_WRITE_STRESS.md
  - 运维排障:
      - 运行时配置: RUNTIME_CONFIGURATION.md
      - 慢检测与掉线策略: monitoring-policies.md
      - 健康监控与告警: HEALTH_ALERT.md
      - 统一通知渠道: NOTIFICATIONS.md
      - 渠道通知模板: NOTIFICATION_TEMPLATES.md
      - 扫描器错误与日志: SCANNER_DIAGNOSTICS.md
      - 请求日志: REQUEST_LOG.md
      - 审计日志: AUDIT_LOG.md
      - pgBackRest 备份恢复: PGBACKREST_BACKUP.md
      - 资源读取与慢依赖隔离: SYSTEM_RESOURCE_RESILIENCE.md
  - 开放平台:
      - 外部 API v1 接入: OPEN_API.md
      - 平台管理与上线: OPEN_API_MANAGEMENT.md
      - 实现与回归: OPEN_API_IMPLEMENTATION.md
  - 开发参考:
      - 操作系统识别维护: OS_DETECTION_DEVELOPMENT.md
      - Web 技术栈识别维护: WEB_DETECTION_DEVELOPMENT.md
      - 模块化实现与热更新: MODULE_RUNTIME_IMPLEMENTATION.md
      - 模块化架构设计: MODULAR_ARCHITECTURE.md
      - 进程替换原型: examples/modular-hot-update/README.md
      - 第三方依赖清单维护: OPEN_SOURCE_CATALOG.md
      - 文档维护与本地预览: DOCUMENTATION.md
      - 语言切换与文档维护: LOCALIZATION.md

hooks:
  - hooks.py

repo_url: https://github.com/wshijiang/network-mapping
repo_name: wshijiang/network-mapping
edit_uri: edit/main/docs/

markdown_extensions:
#开启 mermaid插件
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  #保留中文，避免文档内部的锚链接失效
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra:
  locale: zh-CN
  # 页脚右侧图标
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wshijiang/network-mapping
      name: GitHub 源代码

    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/
      name: Docker Hub

    - icon: fontawesome/solid/globe
      link: https://blog.abdc.world
      name: 博客


# 版权信息
copyright: >
  Copyright &copy; 2026 Network Mapping Project.
  All rights reserved.
  <br>

extra_javascript:
  - assets/language.js
