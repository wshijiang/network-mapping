name: network-mapping
services:
  server:
    image: ${SERVER_IMAGE:?Set SERVER_IMAGE to an approved version or digest}
    env_file: ./.env
    init: true
    restart: unless-stopped
    user: "10001:10001"
    environment:
      SERVER_TLS_NAME: ${SERVER_TLS_NAME:?Set SERVER_TLS_NAME to a certificate DNS name}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["${SERVER_BIND_ADDRESS:-127.0.0.1}:${SERVER_PUBLISH_PORT:-9999}:${NM__SERVER__PORT:-9999}"]
    volumes:
      - ./runtime/tls:/etc/network-mapping/tls:ro
      - server-data:/var/lib/network-mapping
      - server-logs:/var/log/network-mapping
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      elasticsearch:
        condition: service_healthy
        required: false
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  postgres:
    profiles: [local-postgres]
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NM__DATABASE__USERNAME:-network_mapping}
      POSTGRES_DB: ${NM__DATABASE__DB_NAME:-network_mapping}
      POSTGRES_PASSWORD: ${NM__DATABASE__PASSWORD:?Set NM__DATABASE__PASSWORD in docker/.env}
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -t 3 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 20

  elasticsearch:
    profiles: [local-elasticsearch]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0@sha256:8818ab9af72d7482e38a9d6f0454d5ee667564a25bbdc42360c0f9b8f8f72fc5
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Isolated single-host example. For production configure authentication/TLS.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          health="$$(curl --fail --silent --show-error --max-time 7
          'http://localhost:9200/_cluster/health?wait_for_status=yellow&wait_for_no_initializing_shards=true&timeout=5s&filter_path=status,timed_out')"
          && printf '%s\n' "$$health" | grep -Eq '"timed_out"[[:space:]]*:[[:space:]]*false'
          && printf '%s\n' "$$health" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"(green|yellow)"'
      interval: 10s
      timeout: 10s
      retries: 30
    ulimits:
      nofile: {soft: 65536, hard: 65536}

volumes:
  server-data:
  server-logs:
  postgres-data:
  elasticsearch-data:
