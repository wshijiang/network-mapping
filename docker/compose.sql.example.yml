# Optional override: the normal compose file always uses the bundled SQL.
# Set SERVER_SQL_DIRECTORY to an existing directory containing reviewed SQL,
# then set database.init_database_file / sql_file_path in runtime/config.toml.
services:
  server:
    volumes:
      - type: bind
        source: ${SERVER_SQL_DIRECTORY:?Set SERVER_SQL_DIRECTORY to your custom SQL directory}
        target: /etc/network-mapping/sql
        read_only: true
        bind:
          create_host_path: false
