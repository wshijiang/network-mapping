# Standalone Linux host-network deployment. Do not merge with compose.example.yml.
# PostgreSQL and Elasticsearch must already be running at the configured addresses.
name: network-mapping
services:
  server:
    image: ${SERVER_IMAGE:?Set SERVER_IMAGE to an approved version or digest}
    env_file: ./.env.host
    init: true
    restart: unless-stopped
    user: "10001:10001"
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - server-data:/var/lib/network-mapping
      - server-logs:/var/log/network-mapping
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  server-data:
  server-logs:
