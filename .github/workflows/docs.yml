name: Documentation languages
on:
  pull_request:
    branches: [main]
    paths: ['docs/**', 'mkdocs/**', 'scripts/build-docs.py', '.github/workflows/docs.yml', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install documentation tools
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/python -m pip install -r mkdocs/requirements.txt
      - name: Check hooks and build both languages
        run: |
          node --test mkdocs/language.test.cjs
          .venv-docs/bin/python -m unittest discover -s mkdocs -p 'test_*.py'
          .venv-docs/bin/python scripts/build-docs.py
          test -f mkdocs/site/index.html
          test -f mkdocs/site/en/index.html
      - name: Save documentation artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-${{ github.sha }}
          path: mkdocs/site
          if-no-files-found: error
          retention-days: 14
