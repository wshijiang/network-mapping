name: Operating system inference

on:
  pull_request:
    paths:
      - 'src/**'
      - 'source/database/**'
      - 'Cargo.*'
      - '.github/workflows/os-detection.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'source/database/**'
      - 'Cargo.*'
      - '.github/workflows/os-detection.yml'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: network_mapping
          POSTGRES_DB: network_mapping
          POSTGRES_PASSWORD: isolated_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U network_mapping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          xpack.ml.enabled: 'false'
          ingest.geoip.downloader.enabled: 'false'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        ports: ['9200:9200']
        options: >-
          --health-cmd "curl --fail http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      CARGO_BUILD_JOBS: 2
      STORAGE_TEST_DATABASE_URL: 'host=127.0.0.1 port=5432 dbname=network_mapping user=network_mapping password=isolated_test_only'
      OS_TEST_ELASTICSEARCH_URL: 'http://127.0.0.1:9200'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --no-self-update && rustup default 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace --lib
      - name: Verify PostgreSQL job recovery
        run: cargo test --locked --lib os_jobs_wait_for_publication_and_recover_expired_leases -- --ignored --test-threads=1
      - name: Verify real Elasticsearch projections and immutable evidence
        run: cargo test --locked --lib live_os_enrichment_preserves_raw_checksums_and_newer_service_evidence -- --ignored --test-threads=1
      - name: Verify service clocks and repeated publication on real Elasticsearch
        run: cargo test --locked --lib live_elasticsearch_preserves_successful_web_evidence_after_failed_probes -- --ignored --test-threads=1
